<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti - Biblioteca Civica di Trofarello</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* RESET E STRUTTURA ANTIBUG */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; overflow-x: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1318; color: #ffffff; }

        /* NAVBAR FISSA (Identica in tutto il sito) */
        .navbar { background-color: #ffffff; width: 100%; height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 60px; position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon-box { border: 2px solid #111c24; padding: 4px 8px; font-weight: 800; color: #111c24; font-family: 'Merriweather', serif; }
        .nav-links { display: flex; list-style: none; }
        .nav-links a { text-decoration: none; color: #43525e; font-size: 12px; font-weight: 700; padding: 0 16px; text-transform: uppercase; transition: color 0.2s; }
        .nav-links a:hover { color: #d4b27d; }

        /* CONTENUTO PAGINA CONTATTI */
        .contact-page-container { max-width: 1000px; margin: 120px auto 50px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
        h1 { font-family: 'Merriweather', serif; color: #d4b27d; margin-bottom: 30px; }
        
        .info-item { margin-bottom: 30px; display: flex; align-items: flex-start; gap: 15px; }
        .info-item i { color: #d4b27d; font-size: 20px; margin-top: 5px; }
        .info-item h3 { font-family: 'Merriweather', serif; font-size: 18px; margin-bottom: 5px; }
        .info-item p { color: #cbd5e1; line-height: 1.6; }

        .form-box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 10px; border-top: 4px solid #d4b27d; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; background: #1a242c; border: 1px solid #334155; color: white; border-radius: 5px; }
        button { background: #d4b27d; color: #0d1318; padding: 12px 30px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; border-radius: 5px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo-area">
            <div class="logo-icon-box">BC</div>
            <div style="display: flex; flex-direction: column; color: #111c24;">
                <span style="font-size: 15px; font-weight: 800;">Biblioteca civica</span>
                <span style="font-size: 13px; color: #555e66;">di Trofarello</span>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="Siamo.html">Chi Siamo</a></li>
            <li><a href="www.bi-to.it">Catalogo/a></li>
            <li><a href="">Servizi</a></li>
            <li><a href="contatti.html">Contatti</a></li>
          <li><a href="archivio-locale.html">Archivio</a></li>
        </ul>
    </nav>

    <main class="contact-page-container">
        <div class="info-box">
            <h1>Contatti</h1>
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <h3>Sede</h3>
                    <p>Polo Culturale Ex Distilleria<br>Via Cesare Battisti, Trofarello (TO)</p>
                </div>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <div>
                    <h3>Email</h3>
                    <p>biblioteca@comune.trofarello.to.it</p>
                </div>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <div>
                    <h3>Telefono</h3>
                    <p>011 649 3111</p>
                </div>
            </div>
        </div>

        <div class="form-box">
            <h2>Inviaci un messaggio</h2>
            <form>
                <input type="text" placeholder="Nome e Cognome" required>
                <input type="email" placeholder="La tua email" required>
                <textarea rows="5" placeholder="Scrivi qui la tua richiesta..."></textarea>
                <button type="submit">Invia Messaggio</button>
            </form>
        </div>
    </main>

</body>
</html>
